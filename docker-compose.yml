services:
  backend:
    build: ./BACKEND
    environment:
      MOCK_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///./meeting_protocol.db
    ports:
      - "8000:8000"
    volumes:
      - ./BACKEND/uploads:/app/uploads
      - ./BACKEND/exports:/app/exports

  front:
    build: ./FRONT
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

